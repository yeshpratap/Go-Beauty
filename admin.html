<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Go Beauty - Secure Admin Panel</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      background:#fff5f8;
      color:#333;
    }

    #adminApp{
      display:none;
    }

    .checking{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      color:#ad1457;
      font-weight:bold;
    }

    header{
      background:linear-gradient(135deg,#e91e63,#880e4f);
      color:white;
      padding:22px 15px;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    header h1{
      margin:0;
      font-size:32px;
    }

    header p{
      margin:5px 0 0;
    }

    .admin-info{
      text-align:right;
    }

    #adminEmail{
      display:block;
      margin-bottom:8px;
      font-size:14px;
    }

    .logout-btn{
      background:white;
      color:#ad1457;
      border:none;
      padding:10px 18px;
      border-radius:22px;
      cursor:pointer;
      font-weight:bold;
    }

    .container{
      width:95%;
      max-width:1200px;
      margin:25px auto;
    }

    .top-box{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .count{
      background:#fce4ec;
      color:#ad1457;
      padding:12px 18px;
      border-radius:10px;
      font-weight:bold;
    }

    .website-btn{
      text-decoration:none;
      background:#ad1457;
      color:white;
      padding:11px 18px;
      border-radius:22px;
    }

    .booking-card{
      background:white;
      border-radius:15px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 4px 14px rgba(0,0,0,0.10);
    }

    .booking-card h3{
      color:#ad1457;
      margin-top:0;
    }

    .details{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:12px;
    }

    .details p{
      margin:6px 0;
    }

    .status{
      margin-top:15px;
      font-weight:bold;
      padding:8px 13px;
      display:inline-block;
      border-radius:20px;
    }

    .pending{
      background:#fff3cd;
      color:#856404;
    }

    .confirmed{
      background:#d4edda;
      color:#155724;
    }

    .rejected{
      background:#f8d7da;
      color:#721c24;
    }

    .actions{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .actions button{
      border:none;
      padding:10px 16px;
      border-radius:20px;
      cursor:pointer;
      font-weight:bold;
    }

    .confirm-btn{
      background:#28a745;
      color:white;
    }

    .reject-btn{
      background:#ff9800;
      color:white;
    }

    .delete-btn{
      background:#dc3545;
      color:white;
    }

    .empty{
      background:white;
      text-align:center;
      padding:35px;
      border-radius:15px;
    }

    footer{
      background:#880e4f;
      color:white;
      text-align:center;
      padding:17px;
      margin-top:30px;
    }
  </style>
</head>

<body>

<div id="checking" class="checking">
  Checking Admin Login...
</div>

<div id="adminApp">

  <header>
    <div class="header-inner">

      <div>
        <h1>Go Beauty</h1>
        <p>Secure Admin Booking Panel</p>
      </div>

      <div class="admin-info">
        <span id="adminEmail"></span>

        <button
          class="logout-btn"
          onclick="logoutAdmin()">
          Logout
        </button>
      </div>

    </div>
  </header>


  <div class="container">

    <div class="top-box">

      <div class="count">
        Total Bookings:
        <span id="bookingCount">0</span>
      </div>

      <a
        href="index.html"
        class="website-btn">
        Customer Website
      </a>

    </div>


    <div id="bookingList">

      <div class="empty">
        Loading bookings...
      </div>

   <section id="parlourSection" style="margin-top: 35px;">
  <div class="top-box">
    <div class="count">
      Parlour Registrations:
      <span id="parlourCount">0</span>
    </div>
  </div>

  <div id="parlourList">
    <div class="empty">
      Loading parlour registrations...
    </div>
  </div>
</section>


  <footer>
    © 2026 Go Beauty | Secure Admin Panel
  </footer>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  doc,
  updateDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyAZoFqo9YYkdh7doVZwYj3qnugCwbYrwk8",

  authDomain: "go-beauty-67bfe.firebaseapp.com",

  projectId: "go-beauty-67bfe",

  storageBucket: "go-beauty-67bfe.firebasestorage.app",

  messagingSenderId: "509469188904",

  appId: "1:509469188904:web:9ff8e45c6e84b00268661d"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const checking =
document.getElementById("checking");

const adminApp =
document.getElementById("adminApp");

const adminEmail =
document.getElementById("adminEmail");

const bookingList =
document.getElementById("bookingList");

const bookingCount =
document.getElementById("bookingCount");


function safe(value){

  return String(value || "-")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


onAuthStateChanged(auth, (user) => {

  const ADMIN_UID = "bETzAVYtdrb9abcjTDcLbGCO5lo2";

  if (!user || user.uid !== ADMIN_UID) {
    window.location.replace("login.html");
    return;
  }

  document.getElementById("adminEmail").innerText =
    "Logged in: " + user.email;

  // Hide checking screen
  checking.style.display = "none";

  // Show admin panel
  adminApp.style.display = "block";

  // Load bookings
  loadBookings();

});
function loadBookings(){

  const bookingsQuery = query(
    collection(db,"bookings"),
    orderBy("createdAt","desc")
  );


  onSnapshot(

    bookingsQuery,

    (snapshot)=>{

      bookingList.innerHTML = "";

      bookingCount.textContent =
        snapshot.size;


      if(snapshot.empty){

        bookingList.innerHTML =
        `
        <div class="empty">
          अभी कोई booking नहीं है।
        </div>
        `;

        return;

      }


      snapshot.forEach((bookingDoc)=>{

        const booking =
          bookingDoc.data();

        const bookingId =
          bookingDoc.id;

        const status =
          booking.status || "Pending";


        let statusClass =
          "pending";


        if(status === "Confirmed"){

          statusClass =
            "confirmed";

        }


        if(status === "Rejected"){

          statusClass =
            "rejected";

        }


        const card =
          document.createElement("div");


        card.className =
          "booking-card";


        card.innerHTML = `

          <h3>
            ${safe(booking.name)}
          </h3>


          <div class="details">

            <p>
              📞 <b>Mobile:</b><br>
              ${safe(booking.mobile)}
            </p>

            <p>
              💄 <b>Service:</b><br>
              ${safe(booking.service)}
            </p>

            <p>
              📅 <b>Date:</b><br>
              ${safe(booking.date)}
            </p>

            <p>
              🕐 <b>Time:</b><br>
              ${safe(booking.time)}
            </p>

          </div>


          <div class="status ${statusClass}">
            Status: ${safe(status)}
          </div>


          <div class="actions">

            <button
              class="confirm-btn"
              onclick="confirmBooking('${bookingId}')">
              ✓ Confirm
            </button>


            <button
              class="reject-btn"
              onclick="rejectBooking('${bookingId}')">
              ✕ Reject
            </button>


            <button
              class="delete-btn"
              onclick="removeBooking('${bookingId}')">
              🗑️ Delete
            </button>

          </div>

        `;


        bookingList.appendChild(card);

      });

    },


    (error)=>{

      console.error(error);

      bookingList.innerHTML =
      `
      <div class="empty">
        Booking load नहीं हुई।
      </div>
      `;

    }

  );

}


window.confirmBooking =
async function(id){

  try{

    await updateDoc(

      doc(db,"bookings",id),

      {
        status:"Confirmed"
      }

    );

  }
  catch(error){

    console.error(error);

    alert(
      "Booking confirm नहीं हुई."
    );

  }

};


window.rejectBooking =
async function(id){

  try{

    await updateDoc(

      doc(db,"bookings",id),

      {
        status:"Rejected"
      }

    );

  }
  catch(error){

    console.error(error);

    alert(
      "Booking reject नहीं हुई."
    );

  }

};


window.removeBooking =
async function(id){

  const answer =
    confirm(
      "क्या आप यह booking delete करना चाहते हैं?"
    );


  if(!answer){

    return;

  }


  try{

    await deleteDoc(
      doc(db,"bookings",id)
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Booking delete नहीं हुई."
    );

  }

};


window.logoutAdmin =
async function(){

  try{

    await signOut(auth);

    window.location.replace(
      "login.html"
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Logout नहीं हुआ."
    );

  }

};

</script>

</body>
</html>
