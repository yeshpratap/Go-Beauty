<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Go Beauty - Admin Panel</title>

  <style>
    *{
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      margin:0;
      background:#fff5f8;
      color:#333;
    }

    header{
      background:linear-gradient(135deg,#e91e63,#880e4f);
      color:white;
      text-align:center;
      padding:25px 15px;
    }

    header h1{
      margin:0;
      font-size:34px;
    }

    header p{
      margin:7px 0 0;
    }

    .container{
      width:95%;
      max-width:1200px;
      margin:25px auto;
    }

    .top-box{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:20px;
    }

    .count{
      background:#fce4ec;
      color:#ad1457;
      padding:12px 18px;
      border-radius:10px;
      font-weight:bold;
    }

    .home-btn{
      text-decoration:none;
      background:#ad1457;
      color:white;
      padding:11px 18px;
      border-radius:22px;
    }

    .booking-card{
      background:white;
      border-radius:15px;
      padding:20px;
      margin-bottom:18px;
      box-shadow:0 4px 14px rgba(0,0,0,0.10);
    }

    .booking-card h3{
      color:#ad1457;
      margin-top:0;
    }

    .details{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:10px;
    }

    .details p{
      margin:6px 0;
    }

    .status{
      margin-top:15px;
      font-weight:bold;
      padding:8px 12px;
      display:inline-block;
      border-radius:20px;
    }

    .pending{
      background:#fff3cd;
      color:#856404;
    }

    .confirmed{
      background:#d4edda;
      color:#155724;
    }

    .rejected{
      background:#f8d7da;
      color:#721c24;
    }

    .actions{
      margin-top:18px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      padding:10px 16px;
      border-radius:20px;
      cursor:pointer;
      font-weight:bold;
    }

    .confirm-btn{
      background:#28a745;
      color:white;
    }

    .reject-btn{
      background:#ff9800;
      color:white;
    }

    .delete-btn{
      background:#dc3545;
      color:white;
    }

    .empty{
      text-align:center;
      padding:40px;
      background:white;
      border-radius:15px;
    }

    footer{
      background:#880e4f;
      color:white;
      text-align:center;
      padding:17px;
      margin-top:30px;
    }
  </style>
</head>

<body>

<header>
  <h1>Go Beauty</h1>
  <p>Admin Booking Panel</p>
</header>

<div class="container">

  <div class="top-box">

    <div class="count">
      Total Bookings:
      <span id="bookingCount">0</span>
    </div>

    <a href="index.html" class="home-btn">
      Customer Website
    </a>

  </div>

  <div id="bookingList">
    <div class="empty">
      Loading bookings...
    </div>
  </div>

</div>

<footer>
  © 2026 Go Beauty | Admin Panel
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot,
  query,
  orderBy,
  doc,
  updateDoc,
  deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyAZoFqo9YYkdh7doVZwYj3qnugCwbYrwk8",

  authDomain: "go-beauty-67bfe.firebaseapp.com",

  projectId: "go-beauty-67bfe",

  storageBucket: "go-beauty-67bfe.firebasestorage.app",

  messagingSenderId: "509469188904",

  appId: "1:509469188904:web:9ff8e45c6e84b00268661d"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


const bookingList =
document.getElementById("bookingList");

const bookingCount =
document.getElementById("bookingCount");


const bookingsQuery = query(
  collection(db,"bookings"),
  orderBy("createdAt","desc")
);


onSnapshot(bookingsQuery,(snapshot)=>{

  bookingList.innerHTML = "";

  bookingCount.textContent = snapshot.size;


  if(snapshot.empty){

    bookingList.innerHTML =
    `<div class="empty">
      अभी कोई booking नहीं है।
    </div>`;

    return;
  }


  snapshot.forEach((bookingDoc)=>{

    const booking = bookingDoc.data();

    const bookingId = bookingDoc.id;

    const status =
    booking.status || "Pending";


    let statusClass = "pending";


    if(status === "Confirmed"){
      statusClass = "confirmed";
    }


    if(status === "Rejected"){
      statusClass = "rejected";
    }


    const card =
    document.createElement("div");

    card.className = "booking-card";


    card.innerHTML = `

      <h3>
        ${booking.name || "Customer"}
      </h3>

      <div class="details">

        <p>
          📞 <b>Mobile:</b><br>
          ${booking.mobile || "-"}
        </p>

        <p>
          💄 <b>Service:</b><br>
          ${booking.service || "-"}
        </p>

        <p>
          📅 <b>Date:</b><br>
          ${booking.date || "-"}
        </p>

        <p>
          🕐 <b>Time:</b><br>
          ${booking.time || "-"}
        </p>

      </div>


      <div class="status ${statusClass}">
        Status: ${status}
      </div>


      <div class="actions">

        <button
          class="confirm-btn"
          onclick="confirmBooking('${bookingId}')">
          ✓ Confirm
        </button>


        <button
          class="reject-btn"
          onclick="rejectBooking('${bookingId}')">
          ✕ Reject
        </button>


        <button
          class="delete-btn"
          onclick="removeBooking('${bookingId}')">
          🗑 Delete
        </button>

      </div>

    `;


    bookingList.appendChild(card);

  });

});


window.confirmBooking =
async function(id){

  try{

    const bookingRef =
    doc(db,"bookings",id);

    await updateDoc(
      bookingRef,
      {
        status:"Confirmed"
      }
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Booking confirm नहीं हुई."
    );

  }

};


window.rejectBooking =
async function(id){

  try{

    const bookingRef =
    doc(db,"bookings",id);

    await updateDoc(
      bookingRef,
      {
        status:"Rejected"
      }
    );

  }
  catch(error){

    console.error(error);

    alert(
      "Booking reject नहीं हुई."
    );

  }

};


window.removeBooking =
async function(id){

  const confirmDelete =
  confirm(
    "क्या आप यह booking delete करना चाहते हैं?"
  );


  if(!confirmDelete){
    return;
  }


  try{

    const bookingRef =
    doc(db,"bookings",id);

    await deleteDoc(bookingRef);

  }
  catch(error){

    console.error(error);

    alert(
      "Booking delete नहीं हुई."
    );

  }

};

</script>

</body>
</html>
